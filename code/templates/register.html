<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer SignUp</title>
    <link rel="stylesheet"
      href="/static/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body style="background-color:lightblue">
    <div class="p-5 shadow p-3 mb-5 bg-body" id="input-form"
      style="height: auto;">
      <form action="/register" method="POST">
        <h2 style="text-align:center;">Customer Sign-Up</h2>
        <br>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="floatingInput"
            name="username"
            placeholder="name@example.com">
          <label for="floatingInput">Email address (username)</label>
        </div>
        <div class="form-floating">
          <input type="password" class="form-control" id="floatingPassword"
            name="password"
            placeholder="Password">
          <label for="floatingPassword">Password</label>
        </div>
        <br>
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="floatingInput"
            name="fullname"
            placeholder="name">
          <label for="floatingInput">Full Name</label>
        </div>
        <div class="form-floating">
          <textarea class="form-control" placeholder="Address" name="address"
            id="floatingTextarea" style="height: 100px;"></textarea>
          <label for="floatingTextarea">Address</label>
        </div>
        <br>
        <div class="form-floating mb-3">
          <input type="number" class="form-control" id="floatingInput"
            name="pincode"
            placeholder="number">
          <label for="floatingInput">Pincode</label>
        </div>
        <div class="form-floating mb-3">
          <input type="number" class="form-control" id="floatingInput"
            name="phone"
            placeholder="phone">
          <label for="floatingInput">Phone</label>
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-primary" type="submit">Register</button>
        </div>
        <br><div style="color: red;">{{msg}}</div>
      </form>
      <br>
      <div style="text-align: right;">
        Existing User? <a href="/login">Login</a>
      </div>
      <div style="text-align: right;">
        <a href="/registerprofessional">Register as Professional</a>
      </div>
    </div>
  </body>
</html>
